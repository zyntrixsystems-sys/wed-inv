<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f6ead3">
    <title>You're Invited</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Great+Vibes&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body data-stage="landing">

    <!-- ===== shared SVG artwork ===== -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <defs>
            <symbol id="rose" viewBox="-50 -50 100 100">
                <g fill="#f3bcc4">
                    <ellipse cx="0" cy="-27" rx="17" ry="23" />
                    <ellipse cx="0" cy="-27" rx="17" ry="23" transform="rotate(60)" />
                    <ellipse cx="0" cy="-27" rx="17" ry="23" transform="rotate(120)" />
                    <ellipse cx="0" cy="-27" rx="17" ry="23" transform="rotate(180)" />
                    <ellipse cx="0" cy="-27" rx="17" ry="23" transform="rotate(240)" />
                    <ellipse cx="0" cy="-27" rx="17" ry="23" transform="rotate(300)" />
                </g>
                <g fill="#e99cab">
                    <ellipse cx="0" cy="-17" rx="12" ry="16" transform="rotate(18)" />
                    <ellipse cx="0" cy="-17" rx="12" ry="16" transform="rotate(90)" />
                    <ellipse cx="0" cy="-17" rx="12" ry="16" transform="rotate(162)" />
                    <ellipse cx="0" cy="-17" rx="12" ry="16" transform="rotate(234)" />
                    <ellipse cx="0" cy="-17" rx="12" ry="16" transform="rotate(306)" />
                </g>
                <g fill="#d57b8f">
                    <ellipse cx="0" cy="-9" rx="7.5" ry="10.5" transform="rotate(45)" />
                    <ellipse cx="0" cy="-9" rx="7.5" ry="10.5" transform="rotate(135)" />
                    <ellipse cx="0" cy="-9" rx="7.5" ry="10.5" transform="rotate(225)" />
                    <ellipse cx="0" cy="-9" rx="7.5" ry="10.5" transform="rotate(315)" />
                </g>
                <circle r="4" fill="#b85a72" />
            </symbol>

            <symbol id="corner" viewBox="0 0 220 220">
                <g fill="none" stroke="#a9b99a" stroke-width="2" stroke-linecap="round">
                    <path d="M-4 168C46 160 92 118 118 56S176 6 224 -2" />
                    <path d="M-4 206C34 196 64 160 74 120S96 70 124 52" opacity=".7" />
                </g>
                <g fill="#b8c7a8">
                    <ellipse cx="40" cy="146" rx="20" ry="7" transform="rotate(-24 40 146)" />
                    <ellipse cx="86" cy="104" rx="20" ry="7" transform="rotate(-48 86 104)" />
                    <ellipse cx="136" cy="44" rx="18" ry="6.5" transform="rotate(-30 136 44)" />
                    <ellipse cx="60" cy="176" rx="16" ry="6" transform="rotate(-8 60 176)" opacity=".8" />
                </g>
                <use href="#rose" x="-6" y="-6" width="92" height="92" />
                <use href="#rose" x="78" y="40" width="54" height="54" />
                <use href="#rose" x="2" y="112" width="46" height="46" />
                <g fill="#d9b765">
                    <circle cx="150" cy="24" r="3.5" />
                    <circle cx="104" cy="94" r="3" />
                    <circle cx="30" cy="190" r="3" />
                </g>
            </symbol>

            <symbol id="mandala" viewBox="-100 -100 200 200">
                <g fill="none" stroke="#c9a24f" stroke-width=".8">
                    <circle r="96" />
                    <circle r="88" stroke-dasharray="2 4" />
                    <circle r="40" />
                    <circle r="18" />
                    <ellipse cx="0" cy="-62" rx="12" ry="26" />
                    <ellipse cx="0" cy="-62" rx="12" ry="26" transform="rotate(45)" />
                    <ellipse cx="0" cy="-62" rx="12" ry="26" transform="rotate(90)" />
                    <ellipse cx="0" cy="-62" rx="12" ry="26" transform="rotate(135)" />
                    <ellipse cx="0" cy="-62" rx="12" ry="26" transform="rotate(180)" />
                    <ellipse cx="0" cy="-62" rx="12" ry="26" transform="rotate(225)" />
                    <ellipse cx="0" cy="-62" rx="12" ry="26" transform="rotate(270)" />
                    <ellipse cx="0" cy="-62" rx="12" ry="26" transform="rotate(315)" />
                    <ellipse cx="0" cy="-30" rx="6" ry="14" transform="rotate(22.5)" />
                    <ellipse cx="0" cy="-30" rx="6" ry="14" transform="rotate(67.5)" />
                    <ellipse cx="0" cy="-30" rx="6" ry="14" transform="rotate(112.5)" />
                    <ellipse cx="0" cy="-30" rx="6" ry="14" transform="rotate(157.5)" />
                    <ellipse cx="0" cy="-30" rx="6" ry="14" transform="rotate(202.5)" />
                    <ellipse cx="0" cy="-30" rx="6" ry="14" transform="rotate(247.5)" />
                    <ellipse cx="0" cy="-30" rx="6" ry="14" transform="rotate(292.5)" />
                    <ellipse cx="0" cy="-30" rx="6" ry="14" transform="rotate(337.5)" />
                </g>
            </symbol>
        </defs>
    </svg>

    <!-- ===== background ===== -->
    <svg class="corner c-tl px" data-depth="8" viewBox="0 0 220 220" aria-hidden="true">
        <use href="#corner" width="220" height="220" />
    </svg>
    <svg class="corner c-tr px" data-depth="8" viewBox="0 0 220 220" aria-hidden="true">
        <use href="#corner" width="220" height="220" />
    </svg>
    <svg class="corner c-bl px" data-depth="8" viewBox="0 0 220 220" aria-hidden="true">
        <use href="#corner" width="220" height="220" />
    </svg>
    <svg class="corner c-br px" data-depth="8" viewBox="0 0 220 220" aria-hidden="true">
        <use href="#corner" width="220" height="220" />
    </svg>
    <canvas id="fxBack" aria-hidden="true"></canvas>

    <main id="app">

        <!-- ================= 1. LANDING / ENVELOPE ================= -->
        <section class="stage active" id="s-landing" aria-label="Wedding invitation">
            <div class="orbit px" data-depth="14" aria-hidden="true">
                <svg viewBox="-100 -100 200 200">
                    <use href="#mandala" x="-100" y="-100" width="200" height="200" />
                </svg>
            </div>

            <header class="l-head">
                <p class="eyebrow">Together with their families</p>
                <h1 class="names"><span data-bride></span><i>&amp;</i><span data-groom></span></h1>
            </header>

            <div class="scene">
                <div class="float">
                    <div class="shadow"></div>
                    <div class="tilt" id="tilt">
                        <div class="env">
                            <div class="back"></div>

                            <!-- the invitation card (folded, inside the envelope) -->
                            <div class="card" id="card">
                                <div class="card-inner">
                                    <div class="panel top">
                                        <div class="face front">
                                            <div class="c-wrap">
                                                <p class="c-eyebrow">Together with their families</p>
                                                <h3 class="c-names"><span data-bride></span> <i>&amp;</i> <span
                                                        data-groom></span></h3>
                                            </div>
                                        </div>
                                        <div class="face rear"><span class="mono" data-mono></span></div>
                                    </div>
                                    <div class="panel bottom">
                                        <div class="face front">
                                            <div class="c-wrap">
                                                <p class="c-line">invite you to prove you're wedding-guest material</p>
                                                <p class="c-cta">&#10022; The Guest Test &#10022;</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- front pocket -->
                            <div class="pocket">
                                <i class="pl"></i><i class="pr"></i><i class="pb"></i>
                                <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
                                    <g fill="none" stroke="#c9a24f" stroke-width="1" vector-effect="non-scaling-stroke"
                                        opacity=".8">
                                        <polyline points="0,0 52,52 0,100" vector-effect="non-scaling-stroke" />
                                        <polyline points="100,0 48,52 100,100" vector-effect="non-scaling-stroke" />
                                        <polyline points="0,100 50,44 100,100" vector-effect="non-scaling-stroke" />
                                    </g>
                                </svg>
                                <div class="to">For you</div>
                            </div>

                            <!-- flap + wax seal -->
                            <div class="flap-wrap">
                                <div class="flap">
                                    <div class="face front">
                                        <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
                                            <polyline points="0,0 100,0 50,100 0,0" fill="none" stroke="#c9a24f"
                                                stroke-width="1" vector-effect="non-scaling-stroke" opacity=".85" />
                                        </svg>
                                    </div>
                                    <div class="face rear"></div>
                                    <div class="seal" id="seal" aria-hidden="true">
                                        <div class="half l"><span data-mono></span></div>
                                        <div class="half r"><span data-mono></span></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <button class="btn primary cta" id="openBtn" type="button">Open your invitation</button>
        </section>

        <!-- ================= 2. QUESTIONNAIRE ================= -->
        <section class="stage" id="s-quiz" aria-label="Wedding guest test" inert>
            <div class="stage-inner">
                <div class="progress" aria-label="Progress">
                    <p class="p-label" id="pLabel"></p>
                    <div class="p-track"><span class="p-fill" id="pFill"></span></div>
                    <div class="p-steps" id="pSteps"></div>
                </div>
                <div class="q-tilt" id="qTilt">
                    <article class="q-card" id="qCard" aria-live="polite"></article>
                </div>
            </div>
        </section>

        <!-- ================= 3. VERDICT ================= -->
        <section class="stage" id="s-result" aria-label="Your verdict" inert>
            <div class="hearts" id="hearts" aria-hidden="true"></div>
            <div class="stage-inner">
                <div class="r-tilt" id="rTilt">
                    <article class="r-card" id="rCard">
                        <div class="r-badge"><span data-mono></span></div>
                        <h2 class="r-title" id="rTitle"></h2>
                        <p class="r-sub" id="rSub"></p>
                        <p class="r-note" id="rNote"></p>
                        <div class="r-score">
                            <div class="bar"><span id="rBar"></span></div>
                            <small id="rScoreTxt"></small>
                        </div>
                        <div class="r-actions">
                            <button class="btn primary" id="acceptBtn" type="button">Accept invitation</button>
                            <button class="btn ghost" id="retryBtn" type="button">Try again</button>
                            <button class="btn ghost" id="shareBtn" type="button">Share my result</button>
                        </div>
                        <p class="r-msg" id="rMsg" aria-live="polite"></p>
                    </article>
                </div>
            </div>
        </section>
    </main>

    <button class="restart" id="restartBtn" type="button">&#8635; Start over</button>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <canvas id="fxFront" aria-hidden="true"></canvas>

    <noscript>
        <p style="position:fixed;inset:auto 0 20px;text-align:center;font-family:serif">Please enable JavaScript to open
            your invitation.</p>
    </noscript>
    <script src="script.js"></script>
</body>

</html>
